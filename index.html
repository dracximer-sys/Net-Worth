<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Bulanan</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catatan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--tx:#f5f5f7;--tx2:#8e8e93;--sage:#8fbfa9;--blue:#8db0d4;--lav:#b3a4d4;--sand:#dcc09a;--rose:#d89a9a;--sep:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px 18px 130px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mon span{font-size:15px;color:var(--tx2);font-weight:500}
.mon button{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:20px;color:var(--sage);line-height:1}
h1{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:6px 0 16px}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px}
.lbl{font-size:13px;color:var(--tx2);font-weight:500}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.hero{display:flex;align-items:center;gap:18px;width:100%;text-align:left}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid .card{margin:0}
.mini{font-size:19px;font-weight:650;margin:2px 0;letter-spacing:-.3px}
.tg{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tg b{width:8px;height:8px;border-radius:50%}
.bar{height:6px;border-radius:3px;background:var(--card2);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex}
.slide>.card{margin:0;width:100%}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#48484a;transition:all .2s}
.dots i.on{background:var(--tx);width:16px;border-radius:3px}
.avg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cht{display:flex;gap:8px;margin-top:14px}
.cc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.cb{display:flex;align-items:flex-end;gap:3px;width:100%;height:64px}
.cb i{flex:1;border-radius:5px 5px 2px 2px;min-height:3px}
.cc em{font-style:normal;font-size:11px;color:var(--tx2)}
.cc.cur em{color:var(--tx);font-weight:600}
.leg{display:flex;gap:16px;font-size:12px;color:var(--tx2);margin-top:12px}
.leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.cr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin-top:12px}
.cr b{font-weight:500}
.cr .bar{grid-column:1/3;margin:0;height:5px}
.list{background:var(--card);border-radius:22px;overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:13px 16px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:63px;right:0;height:1px;background:var(--sep)}
.ic{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:16px;color:#0b1410}
.main{flex:1;min-width:0}
.nm{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--tx2);margin-top:1px}
.amt{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--tx2);padding:34px 20px;font-size:15px;line-height:1.5}
.addb{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border-radius:20px;padding:15px;margin-bottom:14px;font-size:17px;font-weight:600}
.addb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(94%,460px);z-index:5}
.glass{background:rgba(44,44,46,.62);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.09)}
.tabs{display:flex;border-radius:999px;padding:5px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:10.5px;color:var(--tx2);font-weight:500}
.tabs button.on{background:rgba(255,255,255,.12);color:var(--sage)}
.tabs button[data-v=needs].on{color:var(--blue)}
.tabs button[data-v=bills].on{color:var(--lav)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#ov.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;background:var(--card);border-radius:30px 30px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:11}
#sheet.show{transform:translate(-50%,0)}
#sheet h2{margin:0 0 14px;font-size:20px;text-align:center}
.f{display:block;margin-bottom:10px}
.f small,.sgl{display:block;font-size:12px;color:var(--tx2);margin:0 4px 5px}
.f input,.f select{width:100%;background:var(--card2);color:var(--tx);border:0;border-radius:14px;padding:14px;font:inherit;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
#sgw{margin-bottom:12px}
.sg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ch{display:flex;align-items:center;background:var(--card2);border-radius:999px;flex:none}
.ch button{padding:7px 4px 7px 13px;font-size:14px;white-space:nowrap}
.ch button+button{padding:7px 11px 7px 4px;color:var(--tx2)}
.go{width:100%;color:#0b1410;border-radius:16px;padding:15px;font-size:17px;font-weight:600;margin-top:6px;background:var(--sage)}
.del{width:100%;color:var(--rose);padding:14px;font-size:16px;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px;color:var(--tx2)}
.tot b{color:var(--blue);font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock">
  <div class="tabs glass" id="tabs">
    <button data-a="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Ringkasan</button>
    <button data-a="tab" data-v="needs"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7zM9 7a3 3 0 0 1 6 0"/></svg>Kebutuhan</button>
    <button data-a="tab" data-v="bills"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Tagihan</button>
  </div>
</div>
<div id="ov" data-a="close"></div>
<div id="sheet"></div>
<script>
const MN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CATS={'Bahan baku':'#e3b98c',Makanan:'var(--sage)',Rumah:'var(--blue)',Kesehatan:'var(--rose)',Transport:'var(--sand)',Lainnya:'var(--lav)'};
const BL='var(--blue)',LV='var(--lav)';
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const sum=a=>a.reduce((s,x)=>s+(+x.amt||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>parseInt(String(v||'').replace(/\D/g,''),10)||0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SK='catatan-bulanan-v1';
let S={budget:0,m:{}},tab='home',cur=new Date(),ed=null,SG=[];
cur.setDate(1);cur.setHours(0,0,0,0);
try{const r=localStorage.getItem(SK);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const M=()=>S.m[key(cur)]||(S.m[key(cur)]={needs:[],bills:[]});
const pr=x=>x.price!=null?x.price:(x.qty?Math.round(x.amt/x.qty):x.amt);
function up(t,x){const k=x.name.toLowerCase();S.lib[t]=[{name:x.name,amt:x.amt,cat:x.cat,qty:x.qty,unit:x.unit,price:x.price},...S.lib[t].filter(y=>y.name.toLowerCase()!==k)]}
if(!S.lib){S.lib={need:[],bill:[]};Object.keys(S.m).sort().forEach(k=>{S.m[k].needs.forEach(x=>up('need',x));S.m[k].bills.forEach(x=>up('bill',x))})}
save();
function hist(){const r=[];for(let i=5;i>=0;i--){const d=new Date(cur.getFullYear(),cur.getMonth()-i,1),q=S.m[key(d)];r.push({l:MN[d.getMonth()].slice(0,3),n:q?sum(q.needs):0,b:q?sum(q.bills):0})}return r}
function row(t,x){const c=t==='need'?BL:LV;return `<button class="row" data-a="edit" data-t="${t}" data-id="${x.id}"><i class="ic" style="background:${c}">${esc((x.name||'?')[0].toUpperCase())}</i><div class="main"><div class="nm">${esc(x.name)}</div>${t==='need'?`<div class="sub"><span style="color:${CATS[x.cat]||LV}">●</span> ${esc(x.cat||'Lainnya')}${x.qty?' · '+String(x.qty).replace('.',',')+' '+(x.unit||'pcs')+' × '+fmt(pr(x)):''}</div>`:''}</div><div class="amt">${fmt(x.amt)}</div></button>`}
function render(){
  const m=M(),nT=sum(m.needs),bT=sum(m.bills),tot=nT+bT;
  const title={home:'Ringkasan',needs:'Kebutuhan',bills:'Tagihan'}[tab];
  let h=`<div class="mon"><button data-a="prev" aria-label="Bulan lalu">‹</button><span>${MN[cur.getMonth()]} ${cur.getFullYear()}</span><button data-a="next" aria-label="Bulan depan">›</button></div><h1 style="color:${{needs:BL,bills:LV}[tab]||'var(--tx)'}">${title}</h1>`;
  if(tab==='home'){
    const C=2*Math.PI*52,den=Math.max(S.budget,tot,1),a1=nT/den*C,a2=bT/den*C,left=S.budget-tot,sh=x=>tot?Math.round(x/tot*100):0;
    h+=`<button class="card hero" data-a="budget"><div class="ring"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="52" fill="none" stroke="#2c2c2e" stroke-width="12"/><circle cx="64" cy="64" r="52" fill="none" stroke="var(--blue)" stroke-width="12" stroke-dasharray="${a1.toFixed(1)} ${C.toFixed(1)}"/><circle cx="64" cy="64" r="52" fill="none" stroke="var(--lav)" stroke-width="12" stroke-dasharray="${a2.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-a1).toFixed(1)}"/></svg><b>${S.budget?Math.round(tot/S.budget*100)+'%':'–'}</b></div><div><div class="lbl">Total pengeluaran</div><div class="big">${fmt(tot)}</div><div class="lbl" style="margin-top:6px;color:${S.budget&&left<0?'var(--rose)':'var(--tx2)'}">${S.budget?(left<0?'Melebihi '+fmt(-left):'Sisa '+fmt(left)+' dari '+fmt(S.budget)):'Ketuk untuk atur anggaran'}</div></div></button>`;
    h+=`<div class="grid"><button class="card" data-a="tab" data-v="needs" style="text-align:left;background:linear-gradient(160deg,rgba(141,176,212,.22),var(--card) 70%)"><div class="tg" style="color:var(--blue)"><b style="background:var(--blue)"></b>Kebutuhan</div><div class="mini">${fmt(nT)}</div><div class="lbl">${m.needs.length} catatan</div><div class="bar"><i style="width:${sh(nT)}%;background:var(--blue)"></i></div></button><button class="card" data-a="tab" data-v="bills" style="text-align:left;background:linear-gradient(160deg,rgba(179,164,212,.22),var(--card) 70%)"><div class="tg" style="color:var(--lav)"><b style="background:var(--lav)"></b>Tagihan</div><div class="mini">${fmt(bT)}</div><div class="lbl">${m.bills.length} catatan</div><div class="bar"><i style="width:${sh(bT)}%;background:var(--lav)"></i></div></button></div>`;
    const H=hist(),mx=Math.max(1,...H.map(x=>Math.max(x.n,x.b))),act=H.filter(x=>x.n||x.b),aN=act.length?Math.round(act.reduce((s,x)=>s+x.n,0)/act.length):0,aB=act.length?Math.round(act.reduce((s,x)=>s+x.b,0)/act.length):0;
    const cat={};m.needs.forEach(x=>{const c=x.cat||'Lainnya';cat[c]=(cat[c]||0)+(+x.amt||0)});
    const cr=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,5),cm=cr.length?cr[0][1]:1;
    const top=[...m.needs.map(x=>({...x,t:'need'})),...m.bills.map(x=>({...x,t:'bill'}))].sort((a,b)=>b.amt-a.amt).slice(0,4);
    const none='<div class="lbl" style="padding:16px 0">Belum ada catatan bulan ini.</div>';
    h+=`<div class="slides" id="sl"><div class="slide"><div class="card"><div class="lbl" style="margin-bottom:8px">Riwayat 6 bulan · rata-rata per bulan</div><div class="avg"><div><div class="lbl">Kebutuhan</div><div class="mini" style="color:var(--blue)">${fmt(aN)}</div></div><div><div class="lbl">Tagihan</div><div class="mini" style="color:var(--lav)">${fmt(aB)}</div></div></div><div class="cht">${H.map((x,i)=>`<div class="cc ${i===5?'cur':''}"><div class="cb"><i style="height:${Math.max(3,x.n/mx*64)}px;background:var(--blue)"></i><i style="height:${Math.max(3,x.b/mx*64)}px;background:var(--lav)"></i></div><em>${x.l}</em></div>`).join('')}</div><div class="leg"><span><b style="background:var(--blue)"></b>Kebutuhan</span><span><b style="background:var(--lav)"></b>Tagihan</span></div></div></div>`;
    h+=`<div class="slide"><div class="card"><div class="lbl">Kebutuhan per kategori</div>${cr.length?cr.map(([n,v])=>`<div class="cr"><span>${esc(n)}</span><b>${fmt(v)}</b><div class="bar"><i style="width:${v/cm*100}%;background:${CATS[n]||LV}"></i></div></div>`).join(''):none}</div></div>`;
    h+=`<div class="slide"><div class="card"><div class="lbl">Pengeluaran terbesar bulan ini</div>${top.length?top.map(x=>`<div class="cr"><span><span style="color:${x.t==='need'?BL:LV}">●</span> ${esc(x.name)}</span><b>${fmt(x.amt)}</b></div>`).join(''):none}</div></div></div><div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>`;
  }else{
    const t=tab==='needs'?'need':'bill',L=t==='need'?m.needs:m.bills,T=t==='need'?nT:bT,nm=t==='need'?'kebutuhan':'tagihan';
    h+=`<button class="addb" data-a="add" style="color:${t==='need'?BL:LV}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah ${nm}</button>`;
    h+=L.length?`<div class="lbl" style="margin:0 6px 10px">Total ${fmt(T)} · ${L.length} catatan</div><div class="list">${L.slice().reverse().map(x=>row(t,x)).join('')}</div>`:`<div class="list"><div class="empty">Belum ada ${nm} bulan ini.<br>Ketuk “Tambah” di atas untuk mulai.</div></div>`;
  }
  $('app').innerHTML=h;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  const sl=$('sl');
  if(sl){const ds=document.querySelectorAll('#dots i');sl.onscroll=()=>{const k=Math.round(sl.scrollLeft/(sl.scrollWidth/ds.length));ds.forEach((d,j)=>d.classList.toggle('on',j===k))}}
}
const qn=()=>parseFloat(String($('fq').value).replace(',','.'))||0;
function tt(){const e=$('tt');if(!e)return;const q=qn()||1,p=num($('fa').value);e.innerHTML='<span>'+String(q).replace('.',',')+' '+$('fu').value+' × '+fmt(p)+'</span><b>'+fmt(p*q)+'</b>'}
function sug(){
  const q=($('fn').value||'').trim().toLowerCase();
  SG=(S.lib[ed.type]||[]).filter(x=>!q||x.name.toLowerCase().includes(q)).slice(0,15);
  $('sg').innerHTML=SG.map((x,i)=>`<span class="ch"><button data-a="pick" data-i="${i}">${esc(x.name)}</button><button data-a="rl" data-i="${i}" aria-label="Hapus dari tersimpan">×</button></span>`).join('');
  $('sgw').style.display=SG.length?'':'none';
}
function openSheet(type,id){
  const m=M();ed={type,id:id||null};
  const it=id?(type==='need'?m.needs:m.bills).find(x=>x.id===id):null;
  let h='';
  if(type==='budget'){
    h=`<h2>Anggaran bulanan</h2><label class="f"><small>Jumlah (Rp)</small><input id="fa" inputmode="numeric" value="${S.budget||''}" placeholder="0"></label><button class="go" data-a="save">Simpan</button>`;
  }else{
    h=`<h2>${it?'Ubah':'Tambah'} ${type==='need'?'kebutuhan':'tagihan'}</h2><label class="f"><small>Nama</small><input id="fn" autocomplete="off" value="${it?esc(it.name):''}" placeholder="${type==='need'?'cth. Beras, telur':'cth. Listrik, internet'}"></label><div id="sgw"><span class="sgl">Tersimpan · ketuk untuk memilih</span><div class="sg" id="sg"></div></div><label class="f"><small>${type==='need'?'Harga per satuan (Rp)':'Nominal (Rp)'}</small><input id="fa" inputmode="numeric" value="${it?pr(it):''}" placeholder="0"></label>`;
    if(type==='need')h+=`<div class="two"><label class="f"><small>Jumlah</small><input id="fq" inputmode="decimal" value="${it&&it.qty?it.qty:''}" placeholder="cth. 5"></label><label class="f"><small>Satuan</small><select id="fu">${['pcs','kg','liter'].map(u=>`<option ${((it&&it.unit)||'pcs')===u?'selected':''}>${u}</option>`).join('')}</select></label></div><div class="tot" id="tt"></div><label class="f"><small>Kategori</small><select id="fc">${Object.keys(CATS).map(c=>`<option ${it&&it.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>`;
    h+=`<button class="go" data-a="save" style="background:${type==='need'?BL:LV}">Simpan</button>`+(it?`<button class="del" data-a="del">Hapus</button>`:'');
  }
  $('sheet').innerHTML=h;$('ov').classList.add('show');$('sheet').classList.add('show');
  if(type!=='budget'){sug();tt()}
}
function closeSheet(){$('ov').classList.remove('show');$('sheet').classList.remove('show');ed=null}
document.addEventListener('input',e=>{if(!ed)return;if(e.target.id==='fn')sug();if(e.target.id==='fa'||e.target.id==='fq')tt()});
document.addEventListener('change',e=>{if(e.target.id==='fu')tt()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,id=t.dataset.id,m=M();
  if(a==='tab'){tab=t.dataset.v;render();scrollTo(0,0)}
  else if(a==='prev'||a==='next'){cur=new Date(cur.getFullYear(),cur.getMonth()+(a==='next'?1:-1),1);render()}
  else if(a==='add')openSheet(tab==='bills'?'bill':'need');
  else if(a==='budget')openSheet('budget');
  else if(a==='close')closeSheet();
  else if(a==='edit')openSheet(t.dataset.t,id);
  else if(a==='pick'){const x=SG[+t.dataset.i];if(!x)return;$('fn').value=x.name;$('fa').value=pr(x)||'';if($('fc')&&x.cat)$('fc').value=x.cat;if($('fq')){$('fq').value=x.qty||'';$('fu').value=x.unit||'pcs'}sug();tt();$('fa').focus()}
  else if(a==='rl'){const x=SG[+t.dataset.i];if(!x)return;S.lib[ed.type]=S.lib[ed.type].filter(y=>y.name!==x.name);save();sug()}
  else if(a==='del'){const k=ed.type==='need'?'needs':'bills';m[k]=m[k].filter(x=>x.id!==ed.id);save();closeSheet();render()}
  else if(a==='save'){
    if(ed.type==='budget'){S.budget=num($('fa').value)}
    else{
      const name=$('fn').value.trim(),amt=num($('fa').value);
      if(!name){$('fn').focus();return}
      const k=ed.type==='need'?'needs':'bills';
      let it=ed.id?m[k].find(x=>x.id===ed.id):null;
      if(!it){it={id:uid()};m[k].push(it)}
      it.name=name;it.amt=amt;
      if(ed.type==='need'){it.cat=$('fc').value;it.qty=qn();it.unit=$('fu').value;it.price=amt;it.amt=amt*(it.qty||1)}
      up(ed.type,it);
      tab=ed.type==='need'?'needs':'bills';
    }
    save();closeSheet();render();
  }
});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
